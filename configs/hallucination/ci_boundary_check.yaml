# Small grid used by tests/test_paper_reproduction.py so the paper's central
# claim is re-checked on every push. Same physics parameters as
# paper_section_3_3.yaml; only the grid is coarser, to run in ~10s.
seed: 42
dt: 0.01
t_horizon: 5.0
gamma: 0.5
alpha: 0.6
beta: 0.02
kappa: 0.12
window: 30
ema_alpha: 0.1
use_adaptive_gain: false
grid:
  eta: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  lambda: [0.5, 1.0, 1.5, 2.0, 2.5]
