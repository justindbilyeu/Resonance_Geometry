name: CI

# The previous version of this file could not fail. Six of its fourteen steps
# carried `continue-on-error: true`, most of those also ended in `|| true`, the
# test step named two files of which one did not exist, and the summary printed
# "checks completed" under `if: always()`. A green tick meant nothing.
#
# This version has two jobs:
#   tests       - gates. No continue-on-error, no `|| true`. Red means broken.
#   experiments - does not gate, and says so in its name.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: tests (gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up git safe directory (CI containers)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Three modules fail at COLLECTION, on missing files rather than on
      # anything testable. They cannot be xfail-marked, because pytest never
      # gets far enough to see a mark, so they are excluded here by name with
      # the reason attached. The same three are listed at the bottom of
      # tests/known_failures.txt. Remove one from BOTH places when its
      # dependency lands.
      #
      #   test_mi_and_gain.py   ImportError: adaptive_gain_eta is not exported
      #                         by resonance_geometry.hallucination.phase_dynamics
      #   test_itpu.py          FileNotFoundError:
      #                         Phase_4_Falsification/analysis/compute_itpu.py
      #   test_spin_foam_smoke  ModuleNotFoundError: spin_foam_mc_optimized
      - name: Run test suite
        run: |
          pytest -q \
            --ignore=tests/hallucination/test_mi_and_gain.py \
            --ignore=tests/test_itpu.py \
            --ignore=tests/test_spin_foam_smoke.py

      # Everything currently failing is quarantined in tests/known_failures.txt
      # as xfail(strict=True). Strict means a quarantined test that starts
      # PASSING fails this job, so the list can only shrink. This step just
      # surfaces the debt in the run log.
      - name: Report quarantined tests
        if: always()
        run: |
          echo "## Quarantined tests" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Known failures, xfail(strict=True). See tests/known_failures.txt.' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -v '^\s*#' tests/known_failures.txt | grep -v '^\s*$' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  experiments:
    name: experiments (does not gate)
    runs-on: ubuntu-latest
    # Long-running sweeps and figure generation. Failures here are expected
    # while the experiment scripts are in flux and deliberately do not block a
    # merge. If a step in here becomes something the repo relies on, move it
    # into the `tests` job above rather than leaving it green-by-default.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          if [ -f .pre-commit-config.yaml ]; then pre-commit run -a; else echo "no pre-commit config"; fi

      - name: Ringing sweep
        run: make ring-sweep

      - name: Theory status
        run: make theory-status

      - name: Fluency probe
        run: |
          if [ -f scripts/run_fluency_probe.py ]; then
            python scripts/run_fluency_probe.py
          else
            echo "scripts/run_fluency_probe.py not present"; exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-outputs
          path: |
            results/ringing_sweep/*.json*
            results/fluency_sweep/*.json*
            docs/reports/ringing_boundary.md
            docs/reports/fluency_velocity.md
            docs/assets/figures/fluency_map.png
          if-no-files-found: ignore
